<svg width="800" height="650" viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,6 L6,0 L12,6 L6,12 Z" fill="black" />
    </marker>
  </defs>

  <style>
    .class-rect { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .text-header { font-family: Arial; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .text-prop { font-family: Arial; font-size: 12px; }
    .line { fill: none; stroke: #000000; stroke-width: 1.2; }
  </style>

  <rect x="50" y="50" width="150" height="100" class="class-rect" />
  <line x1="50" y1="80" x2="200" y2="80" class="line" />
  <text x="125" y="70" class="text-header">Web User</text>
  <text x="60" y="100" class="text-prop">login_id: String {id}</text>
  <text x="60" y="120" class="text-prop">password: String</text>
  <text x="60" y="140" class="text-prop">state: UserState</text>

  <rect x="350" y="40" width="150" height="120" class="class-rect" />
  <line x1="350" y1="70" x2="500" y2="70" class="line" />
  <text x="425" y="60" class="text-header">Customer</text>
  <text x="360" y="90" class="text-prop">id: String {id}</text>
  <text x="360" y="110" class="text-prop">address: Address</text>
  <text x="360" y="130" class="text-prop">phone: Phone</text>
  <text x="360" y="150" class="text-prop">email: String</text>

  <rect x="350" y="250" width="160" height="130" class="class-rect" />
  <line x1="350" y1="280" x2="510" y2="280" class="line" />
  <text x="430" y="270" class="text-header">Account</text>
  <text x="360" y="300" class="text-prop">id: String {id}</text>
  <text x="360" y="320" class="text-prop">billing_address: Addr</text>
  <text x="360" y="340" class="text-prop">is_closed: Boolean</text>
  <text x="360" y="360" class="text-prop">open: Date</text>

  <rect x="150" y="450" width="140" height="60" class="class-rect" />
  <line x1="150" y1="480" x2="290" y2="480" class="line" />
  <text x="220" y="470" class="text-header">Shopping Cart</text>
  <text x="160" y="500" class="text-prop">created: Date</text>

  <line x1="200" y1="100" x2="350" y2="100" class="line" />
  <text x="210" y="95" class="text-prop">0..1</text>
  <text x="330" y="95" class="text-prop">1</text>

  <line x1="425" y1="160" x2="425" y2="250" class="line" marker-start="url(#diamond)" />
  <text x="410" y="180" class="text-prop">1</text>
  <text x="410" y="240" class="text-prop">1</text>

  <polyline points="350,330 220,330 220,450" class="line" marker-start="url(#diamond)" />
  <text x="330" y="325" class="text-prop">1</text>
  <text x="230" y="440" class="text-prop">0..1</text>

  <rect x="50" y="220" width="120" height="110" class="class-rect" />
  <text x="110" y="240" class="text-header" font-style="italic">«enumeration»</text>
  <text x="110" y="255" class="text-header">UserState</text>
  <line x1="50" y1="265" x2="170" y2="265" class="line" />
  <text x="60" y="280" class="text-prop">New</text>
  <text x="60" y="295" class="text-prop">Active</text>
  <text x="60" y="310" class="text-prop">Blocked</text>
</svg>